name: Nightly Fitbit update

on:
  schedule:
    # 02:15 EDT (summer) / 01:15 EST (winter) — a single firing that is already
    # past local midnight under BOTH UTC offsets, so no hour guard is needed.
    #
    # The previous setup used two crons (04:15/05:15 UTC) plus a step that
    # skipped unless the ET hour was exactly "00". GitHub delays scheduled runs
    # 1–4 hours under load, so the 04:15 firing usually landed at ET hour 01+
    # and skipped, while the 05:15 firing is 01:15 EDT and so skipped every day
    # all summer. Most nights nothing ran, and the runs still reported success
    # because skipping is success. Starting late and never guarding is strictly
    # better: a delay just pushes the run further into the same ET day.
    - cron: "15 6 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Report ET time
        run: |
          echo "ET now: $(TZ=America/New_York date '+%Y-%m-%d %H:%M')"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install cryptography

      - name: Run update
        env:
          WEBSTEPS_PASSWORD: ${{ secrets.WEBSTEPS_PASSWORD }}
        run: python nightly_update.py
